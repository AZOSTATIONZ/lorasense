<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoRaSense</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header>
  <div class="header-row">
    <div>
      <h1 id="env-name">LoRaSense</h1>
      <div class="sub" id="env-sub">Local monitoring &amp; control</div>
    </div>
    <button class="icon-btn" id="settings-btn" title="Settings">&#9881;</button>
  </div>
</header>
<main>
  <div class="banner" id="banner">Lost connection to the gateway. Retrying&hellip;</div>

  <!-- Dashboard view -->
  <div id="view-dashboard">
    <div class="stats" id="stats"></div>
    <section>
      <h2>Equipment</h2>
      <div id="devices"></div>
    </section>
  </div>

  <!-- Settings view -->
  <div id="view-settings" style="display:none">
    <div class="settings-header">
      <h2>Settings</h2>
      <button class="text-btn" id="back-btn">&larr; Dashboard</button>
    </div>

    <!-- Environment -->
    <section class="settings-section">
      <h3>Environment</h3>
      <div class="form-row">
        <label>Name</label>
        <input type="text" id="env-name-input" maxlength="31">
      </div>
      <div class="form-row">
        <label>Type</label>
        <select id="env-type-input">
          <option value="home">Home</option>
          <option value="farm">Farm &amp; Agriculture</option>
          <option value="greenhouse">Greenhouse</option>
          <option value="industrial">Industrial &amp; Workshop</option>
          <option value="lab">Laboratory &amp; Research</option>
          <option value="custom">Custom</option>
        </select>
      </div>
      <button class="btn-small" id="save-env-btn">Save</button>
    </section>

    <!-- Zones -->
    <section class="settings-section">
      <h3>Zones</h3>
      <div id="zone-list"></div>
      <div class="form-row">
        <input type="text" id="new-zone-name" placeholder="New zone name" maxlength="31">
        <button class="btn-small" id="add-zone-btn">Add</button>
      </div>
    </section>

    <!-- Equipment -->
    <section class="settings-section">
      <h3>Equipment</h3>
      <div id="equipment-list"></div>
      <div class="add-equipment-form" id="add-eq-form">
        <h4>Add equipment</h4>
        <div class="form-row">
          <label>Name</label>
          <input type="text" id="eq-name" maxlength="31">
        </div>
        <div class="form-row">
          <label>Category</label>
          <select id="eq-category">
            <option value="lighting">Lighting</option>
            <option value="fan">Fan / Ventilation</option>
            <option value="pump">Water pump</option>
            <option value="socket">Socket</option>
            <option value="irrigation">Irrigation</option>
            <option value="heating">Heating</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-row">
          <label>Zone</label>
          <select id="eq-zone"></select>
        </div>
        <div class="form-row">
          <label>Relay output</label>
          <select id="eq-output">
            <option value="255">None (monitor only)</option>
          </select>
        </div>
        <button class="btn-small" id="add-eq-btn">Add equipment</button>
      </div>
    </section>

    <!-- Automation rules -->
    <section class="settings-section">
      <h3>Automation Rules</h3>
      <div id="rules-list"></div>
      <div class="add-rule-form" id="add-rule-form">
        <h4>Add rule</h4>
        <div class="form-row">
          <label>Name</label>
          <input type="text" id="rule-name" maxlength="31" placeholder="e.g. Fan on when hot">
        </div>
        <div class="form-row">
          <label>Sensor</label>
          <select id="rule-sensor">
            <option value="0">Temperature</option>
            <option value="1">Humidity</option>
          </select>
        </div>
        <div class="form-row">
          <label>Condition</label>
          <select id="rule-condition">
            <option value="0">Above</option>
            <option value="1">Below</option>
          </select>
        </div>
        <div class="form-row">
          <label>Threshold</label>
          <input type="number" id="rule-threshold" step="0.1" placeholder="30.0">
        </div>
        <div class="form-row">
          <label>Hysteresis</label>
          <input type="number" id="rule-hysteresis" step="0.1" value="2.0">
        </div>
        <div class="form-row">
          <label>Equipment</label>
          <select id="rule-equipment"></select>
        </div>
        <button class="btn-small" id="add-rule-btn">Add rule</button>
      </div>
    </section>
  </div>
</main>

<script src="/js/app.js"></script>
</body>
</html>
